name: Build Linux & WSL Packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options:
          - both
          - linux
          - wsl
        default: 'both'
      upload_artifact:
        description: 'Upload as artifact'
        type: boolean
        default: true

jobs:
  build-linux:
    if: ${{ github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application (reactor)
        run: mvn -f pom-reactor.xml clean install -DskipTests --no-transfer-progress

      - name: Build Linux distribution package
        run: mvn clean package -Pdist-linux -DskipTests --no-transfer-progress

      - name: Verify Linux package
        id: verify
        run: |
          PACKAGE=$(ls target/GeckoCIRCUITS-*-linux.zip)
          if [ -f "$PACKAGE" ]; then
            echo "✓ Linux package created: $PACKAGE"
            SIZE=$(du -h "$PACKAGE" | cut -f1)
            echo "  Size: $SIZE"
            echo "PACKAGE=$PACKAGE" >> $GITHUB_OUTPUT
            echo "PACKAGE_NAME=$(basename $PACKAGE)" >> $GITHUB_OUTPUT

            echo ""
            echo "Package contents:"
            unzip -l "$PACKAGE" | head -30
          else
            echo "✗ Error: Linux package not found"
            exit 1
          fi

      - name: Upload Linux package
        if: ${{ github.event.inputs.upload_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify.outputs.PACKAGE_NAME }}
          path: ${{ steps.verify.outputs.PACKAGE }}
          retention-days: 30

      - name: Summary
        run: |
          echo "### Linux Build Complete ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: \`${{ steps.verify.outputs.PACKAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Features:" >> $GITHUB_STEP_SUMMARY
          echo "- Native Linux desktop application" >> $GITHUB_STEP_SUMMARY
          echo "- HiDPI support" >> $GITHUB_STEP_SUMMARY
          echo "- Headless mode for CI/automation" >> $GITHUB_STEP_SUMMARY

  build-wsl:
    if: ${{ github.event.inputs.platform == 'wsl' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application (reactor)
        run: mvn -f pom-reactor.xml clean install -DskipTests --no-transfer-progress

      - name: Build WSL distribution package
        run: mvn clean package -Pdist-wsl -DskipTests --no-transfer-progress

      - name: Verify WSL package
        id: verify
        run: |
          PACKAGE=$(ls target/GeckoCIRCUITS-*-wsl.zip)
          if [ -f "$PACKAGE" ]; then
            echo "✓ WSL package created: $PACKAGE"
            SIZE=$(du -h "$PACKAGE" | cut -f1)
            echo "  Size: $SIZE"
            echo "PACKAGE=$PACKAGE" >> $GITHUB_OUTPUT
            echo "PACKAGE_NAME=$(basename $PACKAGE)" >> $GITHUB_OUTPUT

            echo ""
            echo "Package contents:"
            unzip -l "$PACKAGE" | head -30
          else
            echo "✗ Error: WSL package not found"
            exit 1
          fi

      - name: Upload WSL package
        if: ${{ github.event.inputs.upload_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify.outputs.PACKAGE_NAME }}
          path: ${{ steps.verify.outputs.PACKAGE }}
          retention-days: 30

      - name: Summary
        run: |
          echo "### WSL Build Complete ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: \`${{ steps.verify.outputs.PACKAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Features:" >> $GITHUB_STEP_SUMMARY
          echo "- Windows Subsystem for Linux integration" >> $GITHUB_STEP_SUMMARY
          echo "- X11 forwarding support (VcXsrv, Xming, WSLg)" >> $GITHUB_STEP_SUMMARY
          echo "- Automatic DISPLAY configuration" >> $GITHUB_STEP_SUMMARY
          echo "- HiDPI support for 4K displays" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Prerequisites:" >> $GITHUB_STEP_SUMMARY
          echo "- WSL 2 with Ubuntu/Debian" >> $GITHUB_STEP_SUMMARY
          echo "- X server (VcXsrv recommended) or WSLg" >> $GITHUB_STEP_SUMMARY
          echo "- Java 21+ installed in WSL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Installation:" >> $GITHUB_STEP_SUMMARY
          echo "1. Extract zip in WSL: \`unzip GeckoCIRCUITS-*-wsl.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Make launcher executable: \`chmod +x run-gecko-wsl.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Run setup (first time): \`./run-gecko-wsl.sh --setup\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Run application: \`./run-gecko-wsl.sh\`" >> $GITHUB_STEP_SUMMARY

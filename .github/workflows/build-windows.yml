name: Build Windows Package

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload as artifact'
        type: boolean
        default: true

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application (reactor)
        run: mvn -f pom-reactor.xml clean install -DskipTests --no-transfer-progress

      - name: Build Windows distribution package
        run: mvn clean package -Pdist-windows -DskipTests --no-transfer-progress

      - name: List generated files
        run: |
          echo "Contents of target directory:"
          ls -lh target/*.zip 2>/dev/null || echo "No zip files found"

      - name: Verify Windows package
        id: verify
        run: |
          PACKAGE=$(ls target/GeckoCIRCUITS-*-windows.zip)
          if [ -f "$PACKAGE" ]; then
            echo "✓ Windows package created: $PACKAGE"
            SIZE=$(du -h "$PACKAGE" | cut -f1)
            echo "  Size: $SIZE"
            echo "PACKAGE=$PACKAGE" >> $GITHUB_OUTPUT
            echo "PACKAGE_NAME=$(basename $PACKAGE)" >> $GITHUB_OUTPUT

            # List contents
            echo ""
            echo "Package contents:"
            unzip -l "$PACKAGE" | head -30
          else
            echo "✗ Error: Windows package not found"
            exit 1
          fi

      - name: Upload Windows package
        if: ${{ github.event.inputs.upload_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify.outputs.PACKAGE_NAME }}
          path: ${{ steps.verify.outputs.PACKAGE }}
          retention-days: 30

      - name: Summary
        run: |
          echo "### Windows Build Complete ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: \`${{ steps.verify.outputs.PACKAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Contents:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "- GeckoCIRCUITS JAR with dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- run-gecko.bat launcher script" >> $GITHUB_STEP_SUMMARY
          echo "- README.md with installation instructions" >> $GITHUB_STEP_SUMMARY
          echo "- Example circuits (optional)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
